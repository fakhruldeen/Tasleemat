site_name: Tasleemat PMO Operating System | تسليمات
site_url: https://fakhr.me/Tasleemat/
site_description: Enterprise Bilingual (English & Arabic) Project Management Artifact & AI Automation Library aligned with PMI PMBOK® 6th, 7th & 8th Edition standards.
site_author: Fakhruldeen & Tasleemat Contributors
repo_url: https://github.com/fakhruldeen/Tasleemat
repo_name: fakhruldeen/Tasleemat
docs_dir: docs

theme:
  name: material
  language: en
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  logo: img/logo.png
  favicon: img/logo.png

extra_css:
  - assets/custom.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

