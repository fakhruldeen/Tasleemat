site_name: Tasleemat PMO Operating System | تسليمات
site_url: https://fakhr.me/Tasleemat/
site_description: Enterprise Bilingual (English & Arabic) Project Management Artifact & AI Automation Library aligned with PMI PMBOK® 6th, 7th & 8th Edition standards.
site_author: Fakhruldeen & Tasleemat Contributors
repo_url: https://github.com/fakhruldeen/Tasleemat
repo_name: fakhruldeen/Tasleemat
docs_dir: docs
use_directory_urls: false

theme:
  name: material
  language: en
  palette:
    # Light mode (Executive Corporate Navy Default)
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode (Clean Executive Slate)
    - scheme: slate
      primary: slate
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  logo: img/logo.png
  favicon: img/logo.png

extra_css:
  - assets/custom.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - assets/tasleemat_data.js
  - assets/explorer.js
  - assets/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

